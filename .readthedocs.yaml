version: 2

# Zensical build, per https://docs.readthedocs.com/platform/latest/intro/zensical.html
build:
  os: ubuntu-lts-latest
  tools:
    python: latest
  jobs:
    install:
      - pip install -r docs/_requirements.txt
      - pip install .
    pre_build:
      # The interactive code blocks install this wheel, so every version of the
      # documentation runs the code it documents. See src/jetfuelburn/_pyodide.py.
      - python -m pip wheel . --no-deps --wheel-dir docs/_static/wheel
    build:
      html:
        - zensical build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
