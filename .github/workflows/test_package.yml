# https://docs.github.com/en/actions/tutorials/build-and-test-code/python
name: Test Python 🐍 package

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "**.bib"
      - "**.ya?ml"
      - "LICENSE"
      - ".gitignore"
      - "**.ipynb"
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "**.md"
      - "**.bib"
      - "**.ya?ml"
      - "LICENSE"
      - ".gitignore"
      - "**.ipynb"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[testing,optionaldependencies]"
      - name: Test with pytest
        run: |
          pytest tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=jetfuelburn --cov-report=xml --cov-report=html
      - name: Upload coverage to Coveralls
        # Upload from a single matrix leg. It uses the built-in GITHUB_TOKEN
        # (no repo secret needed for public repos).
        if: matrix.python-version == '3.14'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.xml
          format: cobertura
